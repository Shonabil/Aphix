name: Deploy Laravel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke Hostdata via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Masuk ke folder project yang benar (Huruf A besar sesuai server)
            cd /home/aphixpr1/Aphix
            
            # Update codingan dari GitHub
            git pull origin main
            
            # Install ulang dependensi biar aman
            composer install --no-dev --optimize-autoloader
            
            # Update database & Bersihkan cache
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
